<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Regalo desbloqueado!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f1e8;
        }

        .contenedor {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: min(90%, 500px);
        }

        .regalo {
            font-size: 100px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <div class="regalo">🎁</div>

        <h1>¡Has desbloqueado el regalo!</h1>

        <p>Enhorabuena 😏</p>
    </div>

</body>
</html>
