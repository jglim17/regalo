<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desbloquea tu regalo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f1e8;
        }

        .contenedor {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: min(90%, 400px);
        }

        .candado {
            font-size: 100px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 20px 0 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #mensaje {
            margin-top: 15px;
            color: #c0392b;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <div class="candado">🔒</div>

        <h1>Hay un regalo esperándote</h1>
        <p>Introduce el código para desbloquearlo.</p>

        <input
            type="text"
            id="codigo"
            placeholder="Código"
            autocomplete="off"
        >

        <button onclick="desbloquear()">Desbloquear</button>

        <div id="mensaje"></div>
    </div>

    <script>
        function desbloquear() {
            const codigo = document.getElementById("codigo").value;

            if (codigo === "1234") {
                window.location.href = "regalo.html";
            } else {
                document.getElementById("mensaje").textContent =
                    "Código incorrecto.";
            }
        }
    </script>

</body>
</html>
